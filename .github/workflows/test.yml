# =============================================================================
# CI 自动化单测 — push 与 PR 时运行
# 只安装测试必要依赖（pytest），不拉重量级依赖（maa/opencv/onnxruntime 等）
# 避免拉满 requirements.txt 拖慢 CI；单测仅覆盖纯逻辑模块（bid_strategy）
# =============================================================================
name: Test

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:

jobs:
  test:
    name: 单元测试 (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 pytest 与轻量测试依赖
        # 注：不采用 `pip install -e .[test]`——会连带安装主依赖（onnxruntime-directml /
        # windows-capture 等仅 Windows 有 wheel），Linux runner 装不上。故只装 pytest +
        # 测试实际需要的轻量依赖（numpy：capabilities 顶层 import；opencv-headless：
        # tools/debug_studio/server 顶层 import cv2——均有 Linux wheel）。
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.0" numpy opencv-python-headless

      - name: 运行单元测试
        run: python -m pytest tests -v