# 临时诊断：验证 secrets.CNB_TOKEN 对 CNB OpenAPI 的权限范围（repo-release:r/rw）
# 用法：gh workflow run check-cnb-token.yml，然后查 Actions 日志输出。
# 注意：CNB API 的 GET 接口要求 Accept: application/json，缺失时返回 406（实测结论）。
name: Check CNB Token

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 验证 CNB_TOKEN 权限
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.cnb.cool/MaaRacingAssistant/MAIN"
          AUTH="Authorization: Bearer ${CNB_TOKEN}"
          JSON='Accept: application/json'

          echo "== 1) 仓库基本信息（repo-basic-info:r）=="
          curl -s -o /tmp/r1.json -w 'HTTP %{http_code}\n' -H "$AUTH" -H "$JSON" "${API}"
          head -c 200 /tmp/r1.json; echo

          echo "== 2) Release 列表（repo-release:r，CNB 目前尚无 Release，404=权限通过但资源不存在）=="
          code=$(curl -s -o /tmp/r2.json -w '%{http_code}' -H "$AUTH" -H "$JSON" "${API}/-/releases?page=1&page_size=3")
          echo "HTTP ${code}"
          head -c 200 /tmp/r2.json; echo

          echo "== 3) 写权限探测：缺参数 POST 创建 Release（repo-release:rw）=="
          echo "预期：403+Missing repo-release:rw = 无写权限；400/422 = 有写权限（参数校验拦下）；201 意外成功则立即清理"
          code=$(curl -s -o /tmp/r3.json -w '%{http_code}' -X POST -H "$AUTH" -H "$JSON" \
            -H 'Content-Type: application/json' -d '{}' "${API}/-/releases")
          echo "HTTP ${code}"
          cat /tmp/r3.json; echo

          echo "判定：1/2 为 200 或 404 → token 可读；3 为 400/422 → token 可写（rw 齐备）"
