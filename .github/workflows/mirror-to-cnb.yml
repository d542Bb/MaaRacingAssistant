name: Mirror to CNB

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# 串行化：发版时序（release.yml 回写 master + tag push）会连续触发本流水线，
# git push --mirror 若并发会互相覆盖/竞态——同一时刻只允许一个同步在跑。
concurrency:
  group: cnb-sync
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to CNB
        env:
          CNB_URL: https://${{ secrets.CNB_USER }}:${{ secrets.CNB_TOKEN }}@cnb.cool/${{ secrets.CNB_ORG }}/${{ secrets.CNB_REPO }}.git
        run: |
          git remote add cnb "$CNB_URL"
          git push --mirror cnb
          git remote remove cnb
