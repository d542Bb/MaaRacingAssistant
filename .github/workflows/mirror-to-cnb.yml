name: Mirror to CNB

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to CNB
        env:
          CNB_URL: https://${{ secrets.CNB_USER }}:${{ secrets.CNB_TOKEN }}@cnb.cool/${{ secrets.CNB_ORG }}/${{ secrets.CNB_REPO }}.git
        run: |
          git remote add cnb "$CNB_URL"
          git push --mirror cnb
          git remote remove cnb
